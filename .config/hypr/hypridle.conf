$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend
# on charger (barrel or USB-C) the panel never turns off and the laptop never suspends
$on_ac = cat /sys/class/power_supply/*/online 2>/dev/null | grep -q 1

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # turn the panel back on after resume; it stays DPMS-off from the 10 min listener otherwise
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = $on_ac || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $on_ac || $suspend_cmd
}
